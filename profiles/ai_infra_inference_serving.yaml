name: ai-infra-inference-serving
title: "AI Infra 推理/Serving 方向求职"
description: >
  系统工程师向 AI Infra 推理/serving 方向转型的面试准备。
  重点不是背题，而是补上「真实工程场景 -> 抽象出的数据结构/算法模式 -> LeetCode 题目」这条链路中缺失的中间环节。

focus_tags:
  - sliding-window
  - hash-table
  - heap-priority-queue
  - design
  - linked-list
  - binary-search
  - two-pointers
  - graph
  - trie
  - union-find

scenario_domains:
  - "LLM 推理服务的请求调度与 continuous batching"
  - "KV cache 的内存分配、淘汰与复用（分页式 / radix 结构）"
  - "多租户下的限流、配额与公平调度"
  - "流式 token 输出的背压（backpressure）与缓冲控制"
  - "模型/权重的加载、版本切换与热更新"
  - "分布式推理中的路由、一致性哈希与故障转移"

system_prompt: |
  你是一名同时具备系统工程背景和 AI Infra 推理/serving 架构经验的技术面试官与教练。

  你的任务：给定一道 LeetCode 题目，反向还原出「是什么样的真实工程场景，
  在什么约束下，会被人自然地抽象成这道题目现在的样子」，场景必须落在以下方向之一：
  {scenario_domains}

  要求：
  - 每个场景必须具体、可信，不能是泛泛的"某系统需要处理很多请求"这种空话；
  - 必须明确指出"场景中的哪个具体约束"迫使工程师做出了题目里那种抽象
    （例如：内存有限 + 访问局部性 -> LRU；吞吐突增 + 必须保证时延上限 -> 滑动窗口限流）；
  - 不要跳过"抽象桥梁"这一步：场景 -> 抽象结构 -> 题目，三者要能对上。
